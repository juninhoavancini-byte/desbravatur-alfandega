<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Desbravatur - Alfândega</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f2f2f2;
  margin: 0;
  padding: 20px;
}

h1 {
  margin-bottom: 5px;
}

h2 {
  font-weight: normal;
}

#reader {
  max-width: 500px;
  margin: 20px auto;
  background: white;
  padding: 10px;
  border-radius: 15px;
}

#resultado {

  background: white;

  padding: 25px;

  border-radius: 15px;

  max-width: 500px;

  margin: 20px auto;

  font-size: 24px;

  font-weight: bold;

}

.sucesso {
  color: green;
}

.erro {
  color: red;
}

#novoScan {

  display: none;

  margin: 20px auto;

  padding: 18px 35px;

  font-size: 20px;

  font-weight: bold;

  border: none;

  border-radius: 12px;

  background: #1b7f3a;

  color: white;

  cursor: pointer;

}

</style>

</head>

<body>


<h1>✈️ DESBRAVATUR</h1>

<h2>ALFÂNDEGA</h2>


<div id="reader"></div>


<div id="resultado">

📷 Aponte para o QR Code

</div>


<button id="novoScan" onclick="novoScan()">

📷 ESCANEAR PRÓXIMO

</button>


<script>


const APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbwFODAHRarZcpTXxwmrQDRN57RnWlis0amVqkj0zcEpB9gCHz_Ca3s28tkZBNN2aLF6sQ/exec";


let scanner = null;

let lendo = true;


/* =====================================
   INICIAR LEITOR
===================================== */

function iniciarScanner() {

  lendo = true;

  document.getElementById("novoScan").style.display =
    "none";

  document.getElementById("resultado").innerHTML =
    "📷 Aponte para o QR Code";

  document.getElementById("resultado").className = "";


  scanner = new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    false

  );


  scanner.render(

    qrLido,

    function() {
      // Ignora erros normais
    }

  );

}


/* =====================================
   QR CODE LIDO
===================================== */

function qrLido(texto) {

  if (!lendo) {
    return;
  }

  lendo = false;


  /*
   IMPORTANTE:
   Para a câmera imediatamente.
  */

  scanner.clear();


  const clube =
    texto
      .trim()
      .toUpperCase();


  const resultado =
    document.getElementById("resultado");


  resultado.innerHTML =
    "⏳ Registrando ponto...";


  const url =
    APPS_SCRIPT +
    "?clube=" +
    encodeURIComponent(clube);


  fetch(url)

    .then(function(resposta) {

      return resposta.text();

    })

    .then(function(dados) {


      if (dados.startsWith("OK:")) {

        resultado.innerHTML =
          "✅ " +
          clube +
          "<br><br>" +
          "+1 PONTO";

        resultado.className =
          "sucesso";


        /*
         Mostra botão para
         próxima leitura.
        */

        document.getElementById("novoScan")
          .style.display = "block";


      }

      else {

        resultado.innerHTML =
          "❌ " +
          dados;

        resultado.className =
          "erro";


        document.getElementById("novoScan")
          .style.display = "block";

      }

    })

    .catch(function(erro) {

      resultado.innerHTML =
        "❌ ERRO DE CONEXÃO";

      resultado.className =
        "erro";


      document.getElementById("novoScan")
        .style.display = "block";

    });

}


/* =====================================
   NOVA LEITURA
===================================== */

function novoScan() {

  /*
   Limpa o leitor antigo
  */

  document.getElementById("reader").innerHTML = "";


  /*
   Começa uma nova leitura
  */

  iniciarScanner();

}


/* =====================================
   PRIMEIRA LEITURA
===================================== */

iniciarScanner();


</script>

</body>

</html>
