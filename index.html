<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Desbravatur - Alfândega</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f2f2f2;
  margin: 0;
  padding: 20px;
}

h1 {
  margin-bottom: 5px;
}

h2 {
  font-weight: normal;
}

#reader {
  max-width: 500px;
  margin: 20px auto;
  background: white;
  padding: 10px;
  border-radius: 15px;
}

#resultado {
  background: white;
  padding: 25px;
  border-radius: 15px;
  max-width: 500px;
  margin: 20px auto;
  font-size: 24px;
  font-weight: bold;
}

.sucesso {
  color: green;
}

.erro {
  color: red;
}

#novoScan {
  display: none;
  margin: 20px auto;
  padding: 18px 35px;
  font-size: 20px;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  background: #1b7f3a;
  color: white;
}

</style>

</head>

<body>

<h1>✈️ DESBRAVATUR</h1>

<h2>ALFÂNDEGA</h2>

<div id="reader"></div>

<div id="resultado">
📷 Aponte para o QR Code
</div>

<button id="novoScan" onclick="iniciarScanner()">
📷 ESCANEAR PRÓXIMO
</button>


<script>

const APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbwFODAHRarZcpTXxwmrQDRN57RnWlis0amVqkj0zcEpB9gCHz_Ca3s28tkZBNN2aLF6sQ/exec";


let scanner = null;

let processando = false;


/* =====================================
   INICIAR CÂMERA
===================================== */

function iniciarScanner() {

  processando = false;

  document.getElementById("novoScan").style.display = "none";

  document.getElementById("resultado").innerHTML =
    "📷 Aponte para o QR Code";

  document.getElementById("resultado").className = "";

  document.getElementById("reader").innerHTML = "";


  scanner = new Html5Qrcode("reader");


  scanner.start(

    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    qrLido,

    function(errorMessage) {
      // Ignora erros normais de procura
    }

  )

  .catch(function(error) {

    document.getElementById("resultado").innerHTML =
      "❌ Não foi possível acessar a câmera";

    document.getElementById("resultado").className =
      "erro";

  });

}


/* =====================================
   QR CODE LIDO
===================================== */

function qrLido(texto) {

  if (processando) {
    return;
  }

  processando = true;


  /*
  PRIMEIRO:
  PARA A CÂMERA.
  */

  scanner.stop()

    .then(function() {

      console.log("Câmera parada.");

      document.getElementById("reader").innerHTML = "";


      /*
      DEPOIS:
      REGISTRA O PONTO.
      */

      registrarPonto(texto);

    })

    .catch(function(error) {

      console.log("Erro ao parar câmera:", error);

      /*
      Mesmo se houver erro ao parar,
      continuamos registrando o ponto.
      */

      registrarPonto(texto);

    });

}


/* =====================================
   REGISTRAR PONTO
===================================== */

function registrarPonto(texto) {

  const clube =
    texto.trim().toUpperCase();


  const resultado =
    document.getElementById("resultado");


  resultado.innerHTML =
    "⏳ Registrando ponto...";


  const url =
    APPS_SCRIPT +
    "?clube=" +
    encodeURIComponent(clube);


  fetch(url)

    .then(function(resposta) {

      return resposta.text();

    })

    .then(function(dados) {

      console.log("Resposta:", dados);


      if (dados.startsWith("OK:")) {

        resultado.innerHTML =
          "✅ " +
          clube +
          "<br><br>" +
          "+1 PONTO";

        resultado.className =
          "sucesso";

      }

      else {

        resultado.innerHTML =
          "❌ " +
          dados;

        resultado.className =
          "erro";

      }


      /*
      MOSTRA O BOTÃO
      PARA UMA NOVA LEITURA.
      */

      document.getElementById("novoScan")
        .style.display = "block";

    })


    .catch(function(error) {

      console.log(error);

      resultado.innerHTML =
        "❌ ERRO DE CONEXÃO";

      resultado.className =
        "erro";


      document.getElementById("novoScan")
        .style.display = "block";

    });

}


/* =====================================
   PRIMEIRA LEITURA
===================================== */

iniciarScanner();

</script>

</body>

</html>
